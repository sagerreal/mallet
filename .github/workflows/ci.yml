name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test+coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (incl. import-boundary gate + design-system rules)
        run: pnpm lint

      - name: Stylelint (CSS design-token lock)
        run: pnpm lint:css

      - name: Unit tests + coverage (≥80%)
        run: pnpm coverage

      # Schema edited without a generated migration. drizzle-kit diffs against the snapshot in
      # shared/db/migrations/meta, NOT the database, so this needs no credentials — it is the
      # migration check CI can actually perform. (Whether an existing migration has been APPLIED
      # is checked by scripts/db-verify.mjs, which runs as the Vercel production build gate.)
      - name: Migration drift (schema edited without a generated migration)
        # drizzle-kit generate never opens a connection, but the config still wants the key to be
        # present — a placeholder keeps this step offline and credential-free.
        env:
          DATABASE_URL: postgres://unused-generate-does-not-connect
        run: |
          pnpm db:generate
          git diff --exit-code shared/db/migrations

  # Integration tests (live Supabase RLS) are NOT run here — they need DB credentials and their
  # modules load config at import. To enable once the leaked credentials are rotated: add repo
  # secrets DATABASE_URL + APP_DATABASE_URL (+ the NEXT_PUBLIC_SUPABASE_* / SUPABASE_SERVICE_ROLE_KEY
  # the config loader requires) and add a job that runs `pnpm test:int` with those in `env`.
